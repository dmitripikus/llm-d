## EPD guide overrides for the decode EPP / InferencePool.
## Layer on top of: recipes/router/base.values.yaml

httpRoute:
  headerMatches:
    EPP-Phase: decode

router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    image:
      registry: ghcr.io/revit13
      repository: llm-d-router-endpoint-picker
      tag: dev-9-6
    pluginsConfigFile: "epd-plugins.yaml"
    pluginsCustomConfig:
      epd-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: vllmhttp-parser
        - type: queue-scorer
        - type: kv-cache-utilization-scorer
        - type: prefix-cache-scorer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: kv-cache-utilization-scorer
            weight: 2
          - pluginRef: prefix-cache-scorer
            weight: 3
        requestHandler:
          parsers:
            - pluginRef: vllmhttp-parser
            - pluginRef: openai-parser

  modelServers:
    matchLabels:
      llm-d.ai/guide: "epd"
      llm-d.ai/role: "decode"
